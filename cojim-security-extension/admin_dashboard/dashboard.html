<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COJIM Security Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="container">
    <h1>COJIM Security Admin Dashboard</h1>
  <button id="darkModeToggle">Toggle Dark Mode</button>
    <nav>
      <ul>
        <li><a href="#youtube">YouTube Comments</a></li>
        <li><a href="#facebook">Facebook Comments</a></li>
        <li><a href="#whitelist">Whitelist Manager</a></li>
        <li><a href="#flagged-words">Flagged Words</a></li>
        <li><a href="#accounts">Flagged Accounts</a></li>
      </ul>
    </nav>
  <section id="dashboard-content">
    <p>Select a tab to view flagged content and reports.</p>
  </section>

  <div id="flagged-words-manager">
    <h2>Flagged Words Manager</h2>
    <input type="text" id="newFlaggedWord" placeholder="Enter word or phrase to flag" />
    <button id="addFlaggedWordBtn">Add Flagged Word</button>
    <ul id="flaggedWordsList"></ul>
  </div>
  </div>
  <script src="dashboard.js"></script>
<div id="whitelist-manager">
  <h2>Whitelist Manager</h2>
  <input type="text" id="newWhitelistDomain" placeholder="Enter domain or URL" />
  <button id="addWhitelistDomainBtn">Add Domain</button>
  <ul id="whitelistEntries"></ul>
</div>

</body>
</html>
