<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COJIM Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white shadow-md rounded px-8 py-6 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-4 text-blue-800">COJIM Admin Login</h2>

    <div class="mb-4">
      <label for="email" class="block text-sm font-semibold text-gray-700">Email</label>
      <input id="email" type="email" class="mt-1 block w-full px-3 py-2 border rounded shadow-sm" />
    </div>

    <div class="mb-4">
      <label for="password" class="block text-sm font-semibold text-gray-700">Password</label>
      <input id="password" type="password" class="mt-1 block w-full px-3 py-2 border rounded shadow-sm" />
    </div>

    <div class="mb-4">
      <button id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
        Sign In
      </button>
    </div>

    <p id="errorMsg" class="text-sm text-red-600 text-center hidden"></p>
  </div>

  <script type="module" src="/auth.js"></script>
</body>
</html>
