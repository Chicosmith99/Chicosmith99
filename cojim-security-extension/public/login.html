<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COJIM Login</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark");
  }
</script>

</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-white min-h-screen flex items-center justify-center">

  <div class="bg-white dark:bg-gray-800 p-8 rounded shadow-md w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6 text-blue-700 dark:text-blue-300 text-center">🔐 COJIM Admin Login</h1>

    <div class="mb-4">
      <label for="email" class="block text-sm mb-1">Email</label>
      <input type="email" id="email" placeholder="you@example.com"
             class="w-full px-3 py-2 border rounded dark:bg-gray-900 dark:border-gray-600" />
    </div>

    <!-- Password Input with Visibility Toggle -->
<div class="mb-4 relative">
  <label for="password" class="block text-sm font-medium mb-1">Password</label>
  <input
    type="password"
    id="password"
    class="w-full px-4 py-2 pr-10 border rounded dark:bg-gray-800 dark:text-white dark:border-gray-600"
    placeholder="Enter your password"
  />
  <button
    type="button"
    id="togglePassword"
    class="absolute top-9 right-3 text-gray-600 dark:text-gray-300 text-lg"
    aria-label="Toggle password visibility"
  >
    👁️
  </button>
</div>
