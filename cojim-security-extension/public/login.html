<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COJIM Login</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-white min-h-screen flex items-center justify-center">

  <div class="bg-white dark:bg-gray-800 p-8 rounded shadow-md w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6 text-blue-700 dark:text-blue-300 text-center">🔐 COJIM Admin Login</h1>

    <div class="mb-4">
      <label for="email" class="block text-sm mb-1">Email</label>
      <input type="email" id="email" placeholder="you@example.com"
             class="w-full px-3 py-2 border rounded dark:bg-gray-900 dark:border-gray-600" />
    </div>

    <div class="mb-4 relative">
      <label for="password" class="block text-sm mb-1">Password</label>
      <input type="password" id="password" placeholder="••••••••"
             class="w-full px-3 py-2 border rounded pr-10 dark:bg-gray-900 dark:border-gray-600" />
      <button type="button" id="togglePassword"
              class="absolute right-3 top-8 transform -translate-y-1/2 text-gray-500 dark:text-gray-300 hover:text-blue-600">
        👁️
      </button>
    </div>

    <button id="loginBtn"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-semibold">
      Sign In
    </button>

    <p id="error" class="text-red-600 text-sm mt-3 hidden text-center"></p>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
