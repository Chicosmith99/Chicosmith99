<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COJIM Admin Login</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-white min-h-screen flex items-center justify-center font-sans">

  <div class="bg-white dark:bg-gray-800 p-8 rounded shadow-md w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-4 text-center">COJIM Admin Login</h2>

    <div class="mb-4">
      <label for="email" class="block text-sm font-medium mb-1">Email</label>
      <input
        id="email"
        type="email"
        class="w-full px-4 py-2 border rounded dark:bg-gray-700 dark:border-gray-600"
        placeholder="Enter your email"
      />
    </div>

    <div class="mb-4 relative">
      <label for="password" class="block text-sm font-medium mb-1">Password</label>
      <input
        id="password"
        type="password"
        class="w-full px-4 py-2 pr-10 border rounded dark:bg-gray-700 dark:border-gray-600"
        placeholder="Enter your password"
      />
      <button
        type="button"
        id="togglePassword"
        class="absolute top-8 right-3 text-gray-500 dark:text-gray-300"
        aria-label="Toggle password visibility"
      >👁️</button>
    </div>

    <button
      id="loginBtn"
      class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition"
    >
      🔐 Sign In
    </button>

    <p id="error" class="mt-4 text-red-500 text-sm hidden text-center"></p>
  </div>

  <script type="module" src="login.js"></script>
  <script>
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.classList.add("dark");
    }
  </script>
</body>
</html>
