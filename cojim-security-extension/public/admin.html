<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COJIM Admin Console</title>
  <link rel="icon" href="favicon.ico" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-white p-6 font-sans transition-colors duration-300">

  <header class="mb-8 flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-extrabold text-blue-800 dark:text-blue-300">COJIM Admin Console</h1>
      <p class="text-sm text-gray-600 dark:text-gray-300">
        Monitor flagged content, manage rules & review reports in real-time.
      </p>
    </div>

    <!-- 🌒 Dark Mode Toggle -->
    <div class="flex items-center space-x-2">
      <input type="checkbox" id="darkModeToggle" class="h-5 w-5 cursor-pointer" />
      <label for="darkModeToggle" class="text-sm cursor-pointer">Dark Mode</label>
    </div>
  </header>

  <!-- Admin Emails -->
  <section class="mb-6">
    <h2 class="text-xl font-semibold mb-2">📧 Admin Emails</h2>
    <ul id="adminEmails" class="space-y-1 mb-2"></ul>
    <div class="flex">
      <input
        id="newAdminEmail"
        placeholder="Add email..."
        class="flex-1 border px-2 py-1 rounded mr-2 dark:bg-gray-800 dark:border-gray-600"
      />
      <button
        onclick="addField('adminEmails')"
        class="bg-blue-600 text-white px-4 py-1 rounded hover:bg-blue-700"
      >
        Add
      </button>
    </div>
  </section>

  <!-- Flagged Logs -->
  <section class="mb-6">
    <h2 class="text-xl font-semibold mb-2">📛 Flagged Logs (Live)</h2>
    <div
      id="logs-container"
      class="space-y-4 overflow-auto max-h-[400px] border rounded p-3 bg-white dark:bg-gray-800 dark:border-gray-600 shadow"
    >
      <p class="text-gray-500 dark:text-gray-300">Loading flagged logs...</p>
    </div>
  </section>

  <!-- Export CSV Button -->
  <div class="flex justify-end">
    <button id="exportCsvBtn" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
      📤 Export CSV
    </button>
  </div>

  <!-- Scripts -->
  <script type="module" src="dashboard.js"></script>
</body>
</html>
