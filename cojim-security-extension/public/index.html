<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COJIM Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded shadow w-full max-w-md">
    <h1 class="text-2xl font-bold mb-4 text-center">🔐 COJIM Admin Login</h1>
    <input id="email" type="email" placeholder="Email" class="w-full border p-2 mb-3 rounded" />
    <input id="password" type="password" placeholder="Password" class="w-full border p-2 mb-3 rounded" />
    <button id="loginBtn" class="bg-blue-600 text-white px-4 py-2 w-full rounded hover:bg-blue-700">Login</button>
    <p id="error" class="text-red-600 mt-4 text-sm text-center hidden"></p>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
