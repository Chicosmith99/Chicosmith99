<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COJIM Admin Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 p-6">
  <h1 class="text-3xl font-bold mb-4">COJIM Admin Console</h1>

  <div class="mb-6">
    <h2 class="text-xl font-semibold mb-2">Admin Emails</h2>
    <ul id="adminEmails" class="space-y-1 mb-2"></ul>
    <input id="newAdminEmail" placeholder="Add email..." class="border px-2 py-1 mr-2" />
    <button onclick="addField('adminEmails')" class="bg-blue-600 text-white px-4 py-1 rounded">Add</button>
  </div>

  <div class="mb-6">
    <h2 class="text-xl font-semibold mb-2">Whitelist</h2>
    <ul id="whitelist" class="space-y-1 mb-2"></ul>
    <input id="newWhitelist" placeholder="Add domain..." class="border px-2 py-1 mr-2" />
    <button onclick="addField('whitelist')" class="bg-blue-600 text-white px-4 py-1 rounded">Add</button>
  </div>

  <div class="mb-6">
    <h2 class="text-xl font-semibold mb-2">Blacklist</h2>
    <ul id="blacklist" class="space-y-1 mb-2"></ul>
    <input id="newBlacklist" placeholder="Add domain..." class="border px-2 py-1 mr-2" />
    <button onclick="addField('blacklist')" class="bg-blue-600 text-white px-4 py-1 rounded">Add</button>
  </div>

  <div class="mb-6">
    <h2 class="text-xl font-semibold mb-2">Custom Spam Patterns</h2>
    <ul id="customSpamPatterns" class="space-y-1 mb-2"></ul>
    <input id="newCustomSpamPatterns" placeholder="Add pattern..." class="border px-2 py-1 mr-2" />
    <button onclick="addField('customSpamPatterns')" class="bg-blue-600 text-white px-4 py-1 rounded">Add</button>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
