<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COJIM Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
  <div class="bg-white p-6 rounded shadow-md w-full max-w-sm">
    <h1 class="text-2xl font-bold text-center text-blue-800 mb-4">COJIM Admin Login</h1>
    <input id="email" type="email" placeholder="Email" class="w-full border px-3 py-2 mb-3 rounded" />
    <input id="password" type="password" placeholder="Password" class="w-full border px-3 py-2 mb-3 rounded" />
    <button id="loginBtn" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Login</button>
    <p id="error" class="text-red-600 mt-2 text-sm text-center hidden"></p>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
